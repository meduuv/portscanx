[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portscanx"
version = "0.1.0"
description = "Dependency-free TCP port scanner for authorized diagnostics"
requires-python = ">=3.10"

[project.scripts]
portscanx = "portscanx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
